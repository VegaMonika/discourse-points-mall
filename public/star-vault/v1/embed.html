<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星辉宝库 · 3D 宝箱</title>
  <link rel="stylesheet" href="embed.css">
  <script type="module" src="embed.js"></script>
</head>
<body>
  <main>
    <div id="stage" tabindex="0" role="group" aria-label="3D 宝箱：拖动旋转，左右方向键旋转，回车开合" aria-describedby="hint">
      <div id="loading" role="status">正在唤醒星光…</div>
    </div>
    <div class="controls">
      <button id="open" type="button" aria-pressed="false" disabled>打开宝箱</button>
      <button id="reset" type="button" aria-label="重置 3D 宝箱视角">重置视角</button>
    </div>
    <p id="hint">拖动旋转 · 仅展示，不消耗积分</p>
    <noscript>3D 展示需要 JavaScript，商店兑换不受影响。</noscript>
  </main>
</body>
</html>
